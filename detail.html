    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f7f6);
      --text-color: var(--tg-theme-text-color, #2c3e50);
      --primary: #0077B6; 
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
      --success: #2ecc71;
    }

    body { 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      padding: 20px; 
      background: var(--bg-color); 
      color: var(--text-color); 
      margin: 0; 
      padding-bottom: 40px; 
    }

    .back-btn { 
      display: inline-flex; 
      align-items: center;
      margin-bottom: 20px; 
      padding: 10px 16px; 
      background: var(--card-bg); 
      color: var(--primary); 
      text-decoration: none; 
      border-radius: 12px; 
      font-size: 0.95rem; 
      font-weight: 600;
      box-shadow: var(--shadow);
      transition: 0.2s;
    }
    .back-btn:hover { transform: translateX(-3px); }

    .card { 
      border-radius: 16px; 
      padding: 24px; 
      background: var(--card-bg); 
      box-shadow: var(--shadow);
    }

    h2 { 
      color: var(--primary); 
      margin-top: 0; 
      font-size: 1.4rem; 
      border-bottom: 2px solid rgba(0, 119, 182, 0.2);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .info-row { margin: 16px 0; }
    .label { font-size: 0.85rem; color: #7f8c8d; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 4px; }
    .value { font-size: 1.05rem; font-weight: 500; }
    .value a { color: var(--success); text-decoration: none; font-weight: 700; }
    
    .phone-link {
      display: inline-block;
      background: rgba(46, 204, 113, 0.1);
      padding: 6px 12px;
      border-radius: 8px;
      margin-top: 4px;
    }
  </style>
</head>
