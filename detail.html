  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f9f4); 
      --text-color: var(--tg-theme-text-color, #1b3320);
      --hint-color: var(--tg-theme-hint-color, #6b8e6b);
      --primary-color: #208a4f; 
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
    }

    * { box-sizing: border-box; }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
      background: var(--bg-color); 
      color: var(--text-color); 
      margin: 0; 
      padding: 16px;
      padding-bottom: 40px; 
    }

    .back-btn { 
      display: inline-flex; 
      align-items: center;
      margin-bottom: 24px; 
      padding: 8px 0; 
      color: var(--primary-color); 
      text-decoration: none; 
      font-size: 16px; 
      font-weight: 600;
    }

    .card { 
      border-radius: 20px; 
      padding: 24px; 
      background: var(--card-bg); 
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.02);
    }

    h2 { 
      margin-top: 0; 
      font-size: 24px; 
      font-weight: 800;
      margin-bottom: 20px;
      letter-spacing: -0.5px;
      color: var(--primary-color);
    }

    .info-block { margin-bottom: 24px; }
    .label { font-size: 13px; color: var(--hint-color); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; margin-bottom: 6px; }
    .value { font-size: 16px; font-weight: 500; line-height: 1.5; }
    
    /* Красивая сочная кнопка позвонить */
    .call-btn {
      display: block;
      background: var(--primary-color);
      color: #fff;
      text-align: center;
      padding: 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(32, 138, 79, 0.3);
      transition: 0.2s;
    }
    .call-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(32, 138, 79, 0.4); }
    
    /* Зеленая кнопка для специалистов */
    .call-btn.spec {
      background: #2ecc71; 
      box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
    }
    .call-btn.spec:hover { box-shadow: 0 6px 16px rgba(46, 204, 113, 0.4); }
  </style>
</head>

      { name: "Майский район", addr: "ул. Энгельса, 68", phone: "8(86633) 23-7-25" }
    ];

    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    const id = urlParams.get('id');

    const data = type === 'opeka' ? OPEKA : KDN;
    const item = data[id];
    const contentDiv = document.getElementById('content');

        if (item) {
      if (type === 'opeka') {
        contentDiv.innerHTML = `
          <h2>${item.name}</h2>
          
          <div class="info-block">
            <div class="label">Адрес</div>
            <div class="value">${item.addr}</div>
          </div>
          
          <div class="info-block">
            <div class="label">Начальник</div>
            <div class="value">${item.head}</div>
            <a href="javascript:void(0)" onclick="callNumber('${item.phone}')" class="call-btn">📞 Позвонить: ${item.phone}</a>
          </div>

          <div class="info-block">
            <div class="label">Специалисты</div>
            <div class="value">${item.spec}</div>
            <a href="javascript:void(0)" onclick="callNumber('${item.specPhone}')" class="call-btn spec">📞 Позвонить: ${item.specPhone}</a>

          <div class="info-block">

      } else {
        contentDiv.innerHTML = `
          <h2>КДН ${item.name}</h2>
          <div class="info-block">
            <div class="label">Адрес</div>
            <div class="value">${item.addr}</div>
          </div>
          <div class="info-block">
            <div class="label">Телефон</div>
            <a href="javascript:void(0)" onclick="callNumber('${item.phone}')" class="call-btn">📞 Позвонить: ${item.phone}</a>
          </div>
        `;
      }
    } else {
      contentDiv.innerHTML = `<p>Информация не найдена.</p>`;
    }

    // Вот эта функция заставит телефон открыть звонилку
    function callNumber(phone) {
      // Очищаем номер от скобок и дефисов
      let cleanPhone = phone.replace(/[^+\d]/g, '');
      
      // Если телефон уже начинается на 8 (российский формат), меняем на +7
      if (cleanPhone.startsWith('8')) {
        cleanPhone = '+7' + cleanPhone.substring(1);
      }

      const tg = window.Telegram.WebApp;
      
      // Если открыто в Телеграме - используем его метод
      if (tg && tg.openLink) {
        tg.openLink('tel:' + cleanPhone);
      } else {
        // Если в браузере
        window.location.href = 'tel:' + cleanPhone;
      }
    }

    Telegram.WebApp.ready();
  </script>

</html>
