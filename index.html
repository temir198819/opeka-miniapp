<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты опеки КБР</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 16px; background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
    h1 { font-size: 1.3rem; margin-bottom: 12px; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 8px; text-align: center; border-radius: 10px; background: #eee; cursor: pointer; font-size: 0.9rem; }
    .tab.active { background: #2AABEE; color: #fff; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 12px; margin-bottom: 10px; background: var(--tg-theme-secondary-bg-color, #f5f5f5); }
    .card b { font-size: 1rem; }
    .small { font-size: 0.85rem; opacity: 0.8; }
    a { color: #2AABEE; }
    input { width: 100%; padding: 10px; border-radius: 10px; border: 1px solid #ccc; margin-bottom: 12px; font-size: 1rem; box-sizing: border-box; }
  </style>
</head>
<body>
  <h1>📍 Опека и КДН КБР</h1>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('opeka')">Опека</div>
    <div class="tab" onclick="switchTab('kdn')">КДН</div>
  </div>
  <input id="search" placeholder="Поиск по району или адресу..." oninput="filter()">
  <div id="list"></div>

  <script>
    const OPEKA = [
      {name:"г.о. Нальчик", addr:"пр. Шогенцукова, 17", phone:"(8662) 42-64-13"},
      {name:"г.о. Прохладный", addr:"ул. Головко, 345", phone:"8(86631) 4-25-67"},
      {name:"г.о. Баксан", addr:"ул. Ленина, 21", phone:"(886634) 4-12-54"},
      {name:"Баксанский район", addr:"ул. Гагарина, 1е", phone:"(886634) 2-10-75"},
      {name:"Зольский район", addr:"п. Залукокоаже, ул. Котова, 16", phone:"8(86637) 4-15-44"},
      {name:"Лескенский район", addr:"с. Анзорей, ул. Шинахова, 1а", phone:"(886639) 9-54-11"},
      {name:"Майский район", addr:"г. Майский, ул. Ленина, 27/2", phone:"(86633) 21-7-01"},
      {name:"Прохладненский район", addr:"ул. Красноармейская, 129", phone:"(86631) 7-67-90"},
      {name:"Терский район", addr:"г.п. Терек, ул. Ленина, 15а", phone:"8(86632) 4-18-47"},
      {name:"Урванский район", addr:"г. Нарткала, ул. Ленина, 35", phone:"(86635) 4-30-62"},
      {name:"Чегемский район", addr:"г. Чегем, Баксанское шоссе, 26", phone:"8(86630) 4-10-48"},
      {name:"Черекский район", addr:"п. Кашхатау, ул. Мечиева, 108", phone:"8(86636) 4-10-20"},
      {name:"Эльбрусский район", addr:"г.п. Тырныауз, пр. Эльбрусский, 39", phone:"(86638) 4-37-52"}
    ];
    const KDN = [
      {name:"Урванский район", addr:"г.п. Нарткала, ул. Ленина 37, каб.6", phone:"8(86635) 4-10-70"},
      {name:"Эльбрусский район", addr:"г.п. Тырныауз, пр. Эльбрусский 39", phone:"8(86638) 4-72-15"},
      {name:"Терский район", addr:"г.п. Терек, ул. Ленина, 15, каб.100", phone:"8(86632) 4-17-44"},
      {name:"Баксанский район", addr:"г. Баксан, ул. Гагарина, 1Е", phone:"8(86634) 4-12-28"},
      {name:"Лескенский район", addr:"с. Анзорей, Шинахова 1А", phone:"8(86639) 9-56-0"},
      {name:"Чегемский район", addr:"г.п. Чегем, Баксанское шоссе, 3", phone:"8(86630) 4-00-27"},
      {name:"г. Баксан", addr:"пр-кт Ленина, 21, каб. 14", phone:"8(86634) 2-13-91"},
      {name:"Черекский район", addr:"п. Кашхатау, ул. Мечиева 108", phone:"—"},
      {name:"Зольский район", addr:"п. Залукокоаже, ул. Комсомольская, 89", phone:"8(86637) 4-16-68"},
      {name:"г. Нальчик", addr:"ул. Кешокова, 70", phone:"8(8662) 77-48-60"},
      {name:"г. Прохладный", addr:"г. Прохладный", phone:"8(86631) 4-14-49"},
      {name:"Прохладненский район", addr:"ул. Гагарина, 47, каб. 401", phone:"8(86631) 4-11-48"},
      {name:"Майский район", addr:"ул. Энгельса, 68", phone:"8(86633) 23-7-25"}
    ];

    let currentTab = 'opeka';

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach((el, i) => {
        el.classList.toggle('active', (tab === 'opeka' && i === 0) || (tab === 'kdn' && i === 1));
      });
      filter();
    }

    function render(items) {
      document.getElementById('list').innerHTML = items.map(o => `
        <div class="card">
          <b>${o.name}</b><br>
          <span class="small">🏠 ${o.addr}</span><br>
          <span class="small">📞 <a href="tel:${o.phone.replace(/[^+\d]/g,'')}">${o.phone}</a></span>
        </div>
      `).join('');
    }

    function filter() {
      const q = document.getElementById('search').value.toLowerCase();
      const data = currentTab === 'opeka' ? OPEKA : KDN;
      const filtered = data.filter(o => (o.name + o.addr).toLowerCase().includes(q));
      render(filtered);
    }

    render(OPЕКА = OPEKA);
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>
