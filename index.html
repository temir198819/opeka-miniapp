<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Опека КБР</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Настройка цветов (подстраивается под тему телеграма) */
    :root {
      --bg-color: var(--tg-theme-bg-color, #f4f7f6);
      --text-color: var(--tg-theme-text-color, #2c3e50);
      --hint-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --primary: #0077B6; /* Морской синий */
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    body { 
      font-family: 'Segoe UI', system-ui, sans-serif; 
      padding: 20px; 
      background: var(--bg-color); 
      color: var(--text-color); 
      margin: 0; 
      padding-bottom: 40px;
    }

    h1 { 
      font-size: 1.5rem; 
      margin-bottom: 20px; 
      text-align: center;
      font-weight: 700;
      color: var(--primary);
    }

    .tabs { 
      display: flex; 
      gap: 10px; 
      margin-bottom: 20px; 
      background: rgba(0,0,0,0.05);
      padding: 5px;
      border-radius: 12px;
    }
    
    .tab { 
      flex: 1; 
      padding: 10px; 
      text-align: center; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 0.95rem; 
      font-weight: 600;
      transition: 0.3s;
      color: var(--text-color);
    }
    
    .tab.active { 
      background: var(--primary); 
      color: #fff;
      box-shadow: 0 2px 8px rgba(0, 119, 182, 0.3);
    }

    input { 
      width: 100%; 
      padding: 14px; 
      border-radius: 12px; 
      border: 2px solid transparent; 
      background: var(--card-bg); 
      color: var(--text-color);
      margin-bottom: 20px; 
      font-size: 1rem; 
      box-sizing: border-box; 
      box-shadow: var(--shadow);
      transition: 0.3s;
    }
    input:focus { outline: none; border-color: var(--primary); }

    /* Карточки */
    .card { 
      border: none; 
      border-radius: 16px; 
      padding: 16px; 
      margin-bottom: 12px; 
      background: var(--card-bg); 
      box-shadow: var(--shadow);
      cursor: pointer; 
      transition: transform 0.2s, box-shadow 0.2s; 
      border-left: 5px solid transparent;
    }
    
    .card:hover { 
      transform: translateY(-3px); 
      box-shadow: 0 6px 16px rgba(0,0,0,0.1);
      border-left-color: var(--primary);
    }
    
    .card b { 
      font-size: 1.1rem; 
      color: var(--primary); 
      display: block;
      margin-bottom: 6px;
    }
    
    .small { 
      font-size: 0.9rem; 
      opacity: 0.8; 
      display: block;
      margin-top: 4px;
    }

    /* Желтая плашка */
    #hint-box { 
      background: #FFF3CD; 
      color: #856404; 
      padding: 16px; 
      border-radius: 12px; 
      margin-bottom: 20px; 
      font-size: 0.95rem; 
      border-left: 5px solid #FFC107; 
      line-height: 1.5;
      box-shadow: var(--shadow);
      display: none;
    }
  </style>
</head>
<body>
  <h1>📍 Опека и КДН КБР</h1>
  
  <div id="hint-box">
    <b>💡 КУДА ОБРАЩАТЬСЯ:</b><br>
    <span id="hint-text"></span>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" onclick="switchTab('opeka')">Опека</div>
    <div class="tab" onclick="switchTab('kdn')">КДН</div>
  </div>
  
  <input id="search" placeholder="🔍 Поиск по району или адресу..." oninput="filter()">
  
  <div id="list"></div>

  <script>
    const OPEKA = [
      { name: "г.о. Нальчик", addr: "г. Нальчик, пр. Шогенцукова, 17", phone: "(8662) 42-64-13" },
      { name: "г.о. Прохладный", addr: "г. Прохладный, ул. Головко, д. 345", phone: "8(86631) 4-25-67" },
      { name: "г.о. Баксан", addr: "г. Баксан, ул. Буденного, 91 (юр.), ул. Ленина, 21 (факт.)", phone: "(886634) 4-12-54" },
      { name: "Баксанский район", addr: "г. Баксан, ул. им. Ю.А. Гагарина, 1е", phone: "(886634) 2-10-75" },
      { name: "Зольский район", addr: "п. Залукокоаже, ул. им. И.Ц. Котова, 16", phone: "8(86637) 4-15-44" },
      { name: "Лескенский район", addr: "с. Анзорей, ул. Шинахова, 1а", phone: "(886639) 9-54-11" },
      { name: "Майский район", addr: "г. Майский, ул. Ленина, 27/2", phone: "(86633) 21-7-01" },
      { name: "Прохладненский район", addr: "г. Прохладный, ул. Красноармейская, д.129", phone: "(86631) 7-67-90" },
      { name: "Терский район", addr: "г.п. Терек, ул. Ленина, 15а", phone: "8(86632) 4-18-47" },
      { name: "Урванский район", addr: "г. Нарткала, ул. Ленина, 35", phone: "(86635) 4-30-62" },
      { name: "Чегемский район", addr: "г. Чегем, ул. Баксанское шоссе, 26", phone: "8(86630) 4-10-48" },
      { name: "Черекский район", addr: "п.г.т. Кашхатау, ул. К. Мечиева, 108", phone: "8(86636) 4-10-20" },
      { name: "Эльбрусский район", addr: "г.п. Тырныауз, пр. Эльбрусский, 39", phone: "(86638) 4-37-52" }
    ];

    const KDN = [
      { name: "Урванский район", addr: "г.п. Нарткала, ул. Ленина д.37 каб.6", phone: "8(86635) 4-10-70" },
      { name: "Эльбрусский район", addr: "г.п. Тырныауз, пр. Эльбрусский д.39", phone: "8(86638) 4-72-15" },
      { name: "Терский район", addr: "г.п. Терек, ул. Ленина, 15, каб.100", phone: "8(86632) 4-17-44" },
      { name: "Баксанский район", addr: "г. Баксан, ул. Гагарина, 1Е", phone: "8(86634) 4-12-28" },
      { name: "Лескенский район", addr: "с. Анзорей, Шинахова 1А", phone: "8(86639) 9-56-0" },
      { name: "Чегемский район", addr: "г.п. Чегем, Баксанское шоссе, 3", phone: "8(86630) 4-00-27" },
      { name: "г. Баксан", addr: "пр-кт Ленина, 21, каб. 14", phone: "8(86634) 2-13-91" },
      { name: "Черекский район", addr: "п. Кашхатау, ул. Мечиева 108", phone: "—" },
      { name: "Зольский район", addr: "п. Залукокоаже, ул. Комсомольская, 89", phone: "8(86637) 4-16-68" },
      { name: "г. Нальчик", addr: "ул. Кешокова, 70", phone: "8(8662) 77-48-60" },
      { name: "г. Прохладный", addr: "г. Прохладный", phone: "8(86631) 4-14-49" },
      { name: "Прохладненский район", addr: "ул. Гагарина, 47, каб. 401", phone: "8(86631) 4-11-48" },
      { name: "Майский район", addr: "ул. Энгельса, 68", phone: "8(86633) 23-7-25" }
    ];

    let currentTab = 'opeka';

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('search').value = ''; 
      document.querySelectorAll('.tab').forEach((el, i) => {
        el.classList.toggle('active', (tab === 'opeka' && i === 0) || (tab === 'kdn' && i === 1));
      });
      filter();
    }

    function render(items) {
      document.getElementById('list').innerHTML = items.map((o, index) => `
        <a href="detail.html?type=${currentTab}&id=${index}" style="text-decoration: none; color: inherit;">
          <div class="card">
            <b>${o.name} ➔</b>
            <span class="small">🏠 ${o.addr}</span>
            <span class="small">📞 ${o.phone}</span>
          </div>
        </a>
      `).join('');
    }

    function filter() {
      const q = document.getElementById('search').value.toLowerCase();
      const data = currentTab === 'opeka' ? OPEKA : KDN;
      const filtered = data.filter(o => (o.name + o.addr).toLowerCase().includes(q));
      render(filtered);
    }

    // Инициализация
    render(OPЕКА = OPEKA);
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const urlParams = new URLSearchParams(window.location.search);
    const filterParam = urlParams.get('filter');
    const hintParam = urlParams.get('hint');

    if (filterParam === 'kdn') switchTab('kdn');

    if (hintParam) {
        document.getElementById('hint-text').innerText = decodeURIComponent(hintParam);
        document.getElementById('hint-box').style.display = 'block';
    }
  </script>
</body>
</html>
